 ln=pts.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' '),ar=`${X(0)},${y0} ${ln} ${X(mx)},${y0}`,cur=x.pf,bx=x.be<=mx?X(x.be):null,

 return`<div class=c><b>กำไร vs จำนวนทริป</b><svg viewBox="0 0 ${Wd} ${H}" width=100% role=img aria-label="กราฟกำไรเทียบจำนวนทริป"><defs><linearGradient id=gG gradientUnits=userSpaceOnUse x1=0 x2=0 y1=${tp} y2=${y0}><stop offset=0 stop-color="var(--ac)" stop-opacity=".5"/><stop offset=1 stop-color="var(--ac)" stop-opacity="0"/></linearGradient><linearGradient id=gR gradientUnits=userSpaceOnUse x1=0 x2=0 y1=${y0} y2=${H-b}><stop offset=0 stop-color="var(--co)" stop-opacity="0"/><stop offset=1 stop-color="var(--co)" stop-opacity=".45"/></linearGradient><clipPath id=cU><rect x=0 y=0 width=${Wd} height=${Math.max(0,y0)}/></clipPath><clipPath id=cD><rect x=0 y=${y0} width=${Wd} height=${Math.max(0,H-y0)}/></clipPath></defs>
${[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3;return`<line x1=${l} x2=${Wd-r} y1=${Y(v)} y2=${Y(v)} stroke="var(--ln)" stroke-width=".7"/><text x=${l-6} y=${Y(v)+3} font-size="9" text-anchor="end" fill="var(--mu)">${k(v)}</text>`}).join('')}
<polygon points="${ar}" fill="url(#gG)" clip-path="url(#cU)"/><polygon points="${ar}" fill="url(#gR)" clip-path="url(#cD)"/>
<line x1=${l} x2=${Wd-r} y1=${y0} y2=${y0} stroke="var(--mu)" stroke-width="1"/><text x=${l+4} y=${y0-4} font-size="9" fill="var(--ac)">กำไร</text><text x=${l+4} y=${y0+11} font-size="9" fill="var(--co)">ขาดทุน</text>
${bx!=null?`<line x1=${bx} x2=${bx} y1=${tp} y2=${H-b} stroke="var(--go)" stroke-width="1.5" stroke-dasharray="4 3"/>${pill(bx,tp-12,'คุ้มทุน '+f(x.be),'var(--go)','#2a1d00')}`:''}
<polyline points="${ln}" fill=none stroke="var(--ac)" stroke-width="3.5" stroke-linecap=round stroke-linejoin=round/>
<line x1=${X(t)} x2=${X(t)} y1=${cy} y2=${H-b} stroke="var(--co)" stroke-width="1" stroke-dasharray="2 3"/><circle cx=${X(t)} cy=${cy} r="11" fill="var(--co)" opacity=".25"/><circle cx=${X(t)} cy=${cy} r="6" fill="var(--co)" stroke="#fff" stroke-width="2"/>${pill(X(t),ly,'ตอนนี้ '+k(cur)+' ฿','var(--co)','#fff')}
<text x=${l} y=${H-9} font-size="10" fill="var(--mu)">0</text><text x=${X(mx/2)} y=${H-9} font-size="10" text-anchor="middle" fill="var(--mu)">${f(mx/2)}</text><text x=${Wd-r} y=${H-9} font-size="10" text-anchor="end" fill="var(--mu)">${f(mx)} ทริป</text></svg><div class=row style="font-size:13px"><span>🔴 ตอนนี้ ${f(t)} ทริป → ${cur<0?'ขาดทุน':'กำไร'} ${f(Math.abs(cur))} ฿</span><span style="color:var(--go)">┆ คุ้มทุน ${f(x.be)} ทริป</span></div></div>`}
function gpsBox(){const m=S.me;if(!m)return`<div class=row><div><b>📍 ใช้ตำแหน่งจริงของคุณ</b><div class=m>ใช้ GPS ของเบราว์เซอร์ คำนวณระยะจากจุดที่คุณอยู่ (ไม่ส่งข้อมูลออกนอกเครื่อง)</div></div><button class=b onclick="A.gps()">เปิด GPS</button></div>`;const d=hv(m,CEN,1),n=A.nearest();return`<div class=row><div><b>📍 พบตำแหน่งแล้ว ±${Math.round(m.ac)} ม.</b><div class=m>${near()?'ใช้เป็นจุดเริ่มวันแรกของแผน':'คุณอยู่ห่างจันทบุรี ≈ '+f(d)+' กม. จึงไม่นำมาคิดเส้นทาง แต่ปุ่ม “นำทาง” ใช้ตำแหน่งจริงได้'}<br>ใกล้คุณที่สุด: ${n.em} ${n.n} (${hv(m,n).toFixed(1)} กม.)</div></div><button class="b s sm" onclick="A.near()">ใกล้ฉัน</button></div>`}
function mapSvg(d){const ids=S.plan.days[d],h=S.plan.hotel!=null?P[S.plan.hotel]:null,pts=ids.map(i=>P[i]),all=[...pts,...(h?[h]:[])],me=near()?S.me:null;if(me)all.push(me);if(!all.length)return'<div class=m>ยังไม่มีจุดในวันนี้</div>';
 const Wv=320,Hv=240,T=256,mxp=(lo,z)=>(lo+180)/360*2**z*T,myp=(la,z)=>{const q=Math.sin(la*Math.PI/180);return(.5-Math.log((1+q)/(1-q))/(4*Math.PI))*2**z*T};
 let z=15;for(;z>8;z--){const xs=all.map(p=>mxp(p.lo,z)),ys=all.map(p=>myp(p.la,z));if(Math.max(...xs)-Math.min(...xs)<=Wv-80&&Math.max(...ys)-Math.min(...ys)<=Hv-80)break}
 const xs=all.map(p=>mxp(p.lo,z)),ys=all.map(p=>myp(p.la,z)),ox=(Math.min(...xs)+Math.max(...xs))/2-Wv/2,oy=(Math.min(...ys)+Math.max(...ys))/2-Hv/2,Q=p=>[mxp(p.lo,z)-ox,myp(p.la,z)-oy],n=2**z;let tiles='';
 for(let tx=Math.floor(ox/T);tx<=Math.floor((ox+Wv-1)/T);tx++)for(let ty=Math.floor(oy/T);ty<=Math.floor((oy+Hv-1)/T);ty++){if(ty<0||ty>=n||tx<0||tx>=n)continue;tiles+=`<img alt="" referrerpolicy="no-referrer" src="https://tile.openstreetmap.org/${z}/${tx}/${ty}.png" onerror="this.remove()" style="position:absolute;left:${((tx*T-ox)/Wv*100).toFixed(3)}%;top:${((ty*T-oy)/Hv*100).toFixed(3)}%;width:${(T/Wv*100+.15).toFixed(3)}%;height:${(T/Hv*100+.15).toFixed(3)}%">`}
 const line=[...(h?[h]:[]),...pts,...(h?[h]:[])].map(p=>Q(p).map(v=>v.toFixed(1)).join(',')).join(' ');
 const mk=pts.map((p,i)=>{const[x,y]=Q(p);return`<circle cx=${x} cy=${y} r="12" fill="var(--ac)" stroke="#fff" stroke-width="2.5"/><text x=${x} y=${y+4.5} text-anchor="middle" font-size="13" font-weight="700" fill="var(--at)">${i+1}</text>`}).join('');
 const hm=h?(([x,y])=>`<circle cx=${x} cy=${y} r="12" fill="#fff" stroke="var(--go)" stroke-width="2.5"/><text x=${x} y=${y+5} font-size="14" text-anchor="middle">🏨</text>`)(Q(h)):'';
 const mm=me?(([x,y])=>`<circle cx=${x} cy=${y} r="9" fill="#2f7cf6" stroke="#fff" stroke-width="3"><animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/></circle><text x=${x+12} y=${y-10} font-size="11" font-weight="700" fill="#1a56c4" stroke="#fff" stroke-width="3" paint-order="stroke">คุณ</text>`)(Q(me)):'';
 return`<div style="position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:14px;border:1px solid var(--ln);background:var(--bg) repeating-linear-gradient(0deg,transparent 0 59px,var(--ln) 59px 60px),repeating-linear-gradient(90deg,transparent 0 79px,var(--ln) 79px 80px)"><div class=m style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:8px;font-size:11px">แผนที่พื้นหลังโหลดไม่ได้ (ต้องต่อเน็ต/ไม่ถูกบล็อกรูปภาพ) · ตำแหน่งและเส้นทางยังเป็นพิกัด GPS จริง</div>${tiles}<svg viewBox="0 0 ${Wv} ${Hv}" style="position:absolute;inset:0;width:100%;height:100%" role=img aria-label="แผนที่เส้นทาง"><polyline points="${line}" fill=none stroke="#fff" stroke-width="7" stroke-linejoin=round stroke-linecap=round opacity=".9"/><polyline points="${line}" fill=none stroke="var(--ac)" stroke-width="3.5" stroke-dasharray="8 5" stroke-linejoin=round />${hm}${mk}${mm}</svg><div style="position:absolute;right:3px;bottom:2px;font-size:9px;background:#fffd;color:#333;padding:0 4px;border-radius:4px">© OpenStreetMap contributors</div></div><div class=m style="font-size:12px;margin-top:4px">เส้นเชื่อมเป็นเส้นตรงตามลำดับจุด · กด “เปิดเส้นทางทั้งวัน” เพื่อดูเส้นทางถนนจริงใน Google Maps</div>`}
/* ===== Actions ===== */
const A={
pv(n){W.prov=n;W.must=[];render(1)},
pq(){$('#pl').innerHTML=pchips($('#pq').value.trim())},
mu(i,e){const a=W.must,k=a.indexOf(i);k<0?a.push(i):a.splice(k,1);e.classList.toggle('on',k<0);$('#mc').textContent=a.length;$('#mw').innerHTML=mwarn()},
go(v){if(v=='res'&&!S.plan){toast('ยังไม่มีแผน — มาตั้งค่าทริปกันก่อน');v='wiz'}if(v=='cmp'&&!S.alts)v='wiz';S.v=v;render()},
th(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'},
sample(i){const c={...SAMPLES[i][3],date:nextSat(),must:[],prov:'จันทบุรี'};Object.assign(W,c,{step:0});track('done');start(c)},
st(k,d,mn,mx){W[k]=Math.min(mx,Math.max(mn,W[k]+d));render(1)},
tg(k){W.st=W.st.includes(k)?W.st.filter(x=>x!=k):[...W.st,k];render(1)},
nx(d){if(d>0&&W.step==3){if(!W.st.length&&!W.must.length){$('#nst').innerHTML='<div class=warn style="margin-top:10px">ยังไม่ได้เลือกสไตล์ — อยากให้ระบบเลือกให้ไหม? <button class="b sm g" onclick="W.st=[\'na\',\'fo\'];render(1)">เลือกให้: ธรรมชาติ + อาหารถิ่น</button></div>';return}track('done');start({...W});return}W.step=Math.max(0,Math.min(3,W.step+d));render()},
fit(){const t=Math.max(0,S.tier-1);if(S.tier==0)return toast('เป็นระดับประหยัดที่สุดแล้ว ลองเอาจุดออกหรือเพิ่มงบ');start(S.cfg,t)},
setB(b){S.cfg.budget=b;W.budget=b;start(S.cfg)},
regen(){S.seed++;start(S.cfg,S.tier)},
del(d,i){S.plan.days[d].splice(i,1);render(1)},
add(d){const u=new Set(S.plan.days.flat()),an=P[S.plan.days[d].slice(-1)[0]]||P[S.plan.hotel]||CEN,w=wd(S.cfg,d),l=P.filter(p=>p.t!='H'&&!u.has(p.i)&&ok(p,S.cfg)&&p.x!=w).sort((a,b)=>hv(an,a)-hv(an,b)).slice(0,6);modal(`<h3>เพิ่มจุดในวันที่ ${d+1}</h3>${l.map(p=>`<div class=row style="margin:8px 0"><div>${p.em} <b>${p.n}</b><div class=m>${hv(an,p).toFixed(1)} กม. · ${p.p?f(p.p)+'฿':'ฟรี'}</div></div><button class="b sm" onclick="A.ins(${d},${p.i})">เพิ่ม</button></div>`).join('')||'<p class=m>ไม่มีสถานที่ที่ตรงเงื่อนไขเหลือแล้ว</p>'}`)},
ins(d,id){const a=S.plan.days[d],p=P[id];let b=a.length,bc=1e9;for(let i=0;i<=a.length;i++){const x=i?P[a[i-1]]:S.plan.hotel!=null?P[S.plan.hotel]:p,y=i<a.length?P[a[i]]:S.plan.hotel!=null?P[S.plan.hotel]:p,c=hv(x,p)+hv(p,y)-hv(x,y);if(c<bc){bc=c;b=i}}a.splice(b,0,id);modal();render(1);toast('เพิ่มแล้ว งบคำนวณใหม่ให้ทันที')},
swap(d,i){const cur=d<0?P[S.plan.hotel]:P[S.plan.days[d][i]],u=new Set([...S.plan.days.flat(),S.plan.hotel]),w=d<0?-9:wd(S.cfg,d),l=P.filter(p=>p.t==cur.t&&!u.has(p.i)&&ok(p,S.cfg)&&p.x!=w).sort((a,b)=>hv(cur,a)-hv(cur,b)).slice(0,3);
 modal(`<h3>เปลี่ยนจุดนี้ — 3 ทางเลือกใกล้เคียง</h3><p class=m>แทน: ${cur.em} ${cur.n}</p>${l.map(p=>`<div class=row style="margin:8px 0"><div>${p.em} <b>${p.n}</b><div class=m>ห่าง ${hv(cur,p).toFixed(1)} กม. · ${p.p?f(p.p)+'฿':'ฟรี'} (${p.p>=cur.p?'+':''}${f(p.p-cur.p)}฿)</div></div><button class="b sm" onclick="A.rep(${d},${i},${p.i})">เลือก</button></div>`).join('')||'<p class=m>ไม่มีทางเลือกอื่นที่ตรงเงื่อนไข</p>'}`)},
rep(d,i,id){if(d<0)S.plan.hotel=id;else S.plan.days[d][i]=id;modal();render(1);toast('เปลี่ยนแล้ว งบคำนวณใหม่ให้ทันที')},
book(id){track('click');const p=P[id],c=S.cfg,n=p.t=='H'?rooms(c)*(c.days-1):pax(c),cm=p.p*n*S.ad.com/100;modal(`<h3>🔖 จองผ่านพาร์ทเนอร์</h3><div class=warn>ตัวอย่างสำหรับ Demo — ยังไม่มีการจองจริง</div><p><b>${p.em} ${p.n}</b><br>ยอดโดยประมาณ ${f(p.p*n)} ฿</p><p class=m>ระบบบันทึกการคลิกแล้ว (รวม ${S.ev.click} ครั้งในอุปกรณ์นี้) ในระบบจริงจะพาไปหน้าจองของพาร์ทเนอร์พร้อมรหัสอ้างอิง TF-${p.i}-${S.ev.click} ทำให้เรารับค่าคอมมิชชันประมาณ ${f(cm)} ฿ (${S.ad.com}%)</p><a class=b target=_blank rel=noopener href="${gp(p)}">📍 ดูเส้นทางไปที่นี่</a>`)},
pay(t){track('paid');modal(`<h3>⭐ ${t}</h3><div class=warn>จำลองเท่านั้น ไม่มีการตัดเงินจริง</div><p class=m>บันทึกเป็นการสมัครจำลองแล้ว (${S.ev.paid} ครั้งในอุปกรณ์นี้) และจะไปรวมในหน้า Dashboard ผู้ดูแล</p>`)},
ad(){$('#ad').innerHTML=admBody()},
nearest(){return P.filter(p=>p.t!='H').sort((a,b)=>hv(S.me,a)-hv(S.me,b))[0]},
near(){const l=P.filter(p=>p.t!='H').sort((a,b)=>hv(S.me,a)-hv(S.me,b)).slice(0,5);modal(`<h3>📍 ใกล้คุณตอนนี้</h3>${l.map(p=>`<div class=row style="margin:8px 0"><div>${p.em} <b>${p.n}</b><div class=m>${hv(S.me,p).toFixed(1)} กม. ตามถนน (ประมาณ)</div></div><a class="b sm" target=_blank rel=noopener href="${gp(p)}">นำทาง</a></div>`).join('')}`)},
gps(){if(!navigator.geolocation)return toast('เบราว์เซอร์นี้ไม่รองรับ GPS');toast('กำลังหาตำแหน่ง… กด “อนุญาต” เมื่อเบราว์เซอร์ถาม');
 try{navigator.geolocation.watchPosition(p=>{const first=!S.me;S.me={la:p.coords.latitude,lo:p.coords.longitude,ac:p.coords.accuracy};if(first){toast('พบตำแหน่งของคุณแล้ว 📍');if(S.v=='res'||S.v=='home')render(1)}else if(S.v=='res'){$('#gps').innerHTML=gpsBox();$('#map').innerHTML=mapSvg(S.day)}},e=>toast(e.code==1?'ไม่ได้รับอนุญาตใช้ตำแหน่ง — เปิดสิทธิ์ Location ให้เว็บนี้ แล้วลองใหม่ (ถ้าเปิดในพรีวิว ให้เปิดลิงก์ในแท็บใหม่)':'หาตำแหน่งไม่ได้ ลองออกที่โล่งหรือเปิด GPS ในเครื่อง'),{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}catch(e){toast('เปิด GPS ไม่สำเร็จ')}},
share(){const c=S.cfg,r=calc(S.plan,c),tx=`🌴 ทริป${c.prov||'จันทบุรี'} ${c.days} วัน ${c.a+c.e+c.k} คน\n💰 ใช้ ${f(r.total)} ฿ จากงบ ${f(c.budget)} ฿\n`+r.d.map((d,i)=>`วันที่ ${i+1}: ${d.rows.map(x=>x.p.n).join(' → ')}`).join('\n')+`\n✨ วางแผนด้วย TripFit ${location.href.split('#')[0]}`;S.tx=tx;
 modal(`<div class=sc><div class=m style="color:#e6f4f1">TripFit · ${c.prov||'จันทบุรี'}</div><div class=k>${c.days} วัน · ${f(r.total)} ฿</div><div style="font-size:14px">งบ ${f(c.budget)} ฿ · ${c.a+c.e+c.k} คน · ${r.km.toFixed(0)} กม.</div><hr style="border:0;border-top:1px solid #fff4">${r.d.map((d,i)=>`<div style="font-size:14px;margin:4px 0"><b>วัน ${i+1}</b> ${d.rows.map(x=>x.p.em).join(' ')}</div>`).join('')}</div><textarea id=tx readonly style="width:100%;box-sizing:border-box;height:110px;margin:10px 0;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);font:inherit;padding:8px">${tx}</textarea><button class=b onclick="A.copy()">📋 คัดลอกข้อความ/ลิงก์</button>`)},
copy(){const t=S.tx,ok=()=>toast('คัดลอกแล้ว');try{navigator.clipboard.writeText(t).then(ok,()=>A.cp2())}catch(e){A.cp2()}},
cp2(){const e=$('#tx');e.select();try{document.execCommand('copy');toast('คัดลอกแล้ว')}catch(x){toast('กดค้างที่ข้อความแล้วเลือกคัดลอก')}}};
function render(keep){setProv(S.v=='wiz'?W.prov:S.cfg?S.cfg.prov||'จันทบุรี':W.prov);$('#app').innerHTML=V[S.v]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.v));if(!keep)scrollTo(0,0)}
track('visit');render();
</script></body></html>
